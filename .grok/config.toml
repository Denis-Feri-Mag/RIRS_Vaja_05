# Projektna nastavitev za Grok Build.
# Tukaj so samo MCP, vtičniki in dovoljenja.

[permission]
deny = [
  "Bash(rm -rf *)",
  "Bash(git push --force *)",
  "Bash(git push -f *)",
  "Bash(git push --force-with-lease *)",
  "Read(**/.env)",
  "Read(**/.env.local)",
  "Read(**/.env.production)",
  "Read(**/.env.development)",
  "Read(**/*.pem)",
  "Read(**/*.key)",
  "Read(**/id_rsa)",
  "Read(**/id_ed25519)",
  "Edit(**/.env)",
  "Edit(**/.env.local)",
  "Edit(**/*.pem)",
  "Edit(**/*.key)",
]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_TOKEN}" }
